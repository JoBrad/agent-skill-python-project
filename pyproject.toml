# Dev-only: tests and tooling for the python-project skill. The skill's own
# pyproject.toml lives in python-project/ and never reads this file.
[project]
name = "agent-skill-python-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
required-version = ">=0.13.4"

[tool.uv.sources]
python-project = { path = "python-project", editable = true }

[tool.ruff]
# Lets isort classify python_project as first-party.
src = ["python-project/src", "tests"]
# The formatter wraps at 88. E501 (below) tolerates up to 100 for what the
# formatter cannot wrap: long strings, URLs, and comments.
line-length = 88
indent-width = 4
# Without this, `exclude` entries are ignored for paths passed explicitly
# (e.g. by pre-commit or `ruff check tests/`) and only apply to bare `ruff check`.
force-exclude = true
# Eval fixtures are other projects, some deliberately off the baseline.
extend-exclude = ["evals/files"]
# No target-version: ruff infers it from `requires-python`.

[tool.ruff.lint]
preview = true
select = [
  "A",       # flake8-builtins
  "ARG",     # flake8-unused-arguments
  "B",       # flake8-bugbear
  "COM",     # flake8-commas
  "C4",      # flake8-comprehensions
  "C90",     # mccabe complexity
  "D",       # pydocstyle
  "E1",      # indentation
  "E2",      # whitespace
  "E3",      # blank lines
  "E4",      # import errors
  "E5",      # line length
  "E7",      # statement errors
  "E9",      # runtime errors
  "F",       # pyflakes
  "I",       # isort
  "N",       # pep8-naming
  "PERF",    # Perflint
  "too-many-branches",             # PLR0912
  "too-many-arguments",            # PLR0913
  "too-many-statements",           # PLR0915
  "too-many-positional-arguments", # PLR0917
  "PTH",     # flake8-use-pathlib
  "Q",       # flake8-quotes
  "RET",     # flake8-return
  "RUF",     # ruff
  "SIM",     # flake8-simplify
  "TID",     # flake8-tidy-imports
  "UP",      # pyupgrade
]
# Annotation rules follow the typing mode in [tool.basedpyright] typeCheckingMode:
# off = none, basic = public return types only, standard and strict = ["ANN"].
extend-select = ["ANN"]

ignore = [
  "missing-trailing-comma",            # Conflicts with the formatter's own trailing-comma handling
  "incorrect-blank-line-before-class", # 1 blank line required before class docstring
  "multi-line-summary-second-line",    # Multi-line docstring summary should start at the second line
  "any-type", # Allow Any in annotations (typing mode: standard)
]

[tool.ruff.lint.per-file-ignores]
# Tests are linted, but they do not need docstrings, annotations, or lean
# signatures: fixtures arrive as arguments, and a test's name is its docstring.
"tests/**" = [
  "D",
  "ANN",
  "ARG",
  "too-many-arguments",
  "too-many-positional-arguments",
]

[tool.ruff.lint.flake8-annotations]
# Don't require type annotations for __init__ methods.
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# Combine as imports on the same line
combine-as-imports = true
# Use a single line after each import block.
lines-after-imports = 2
# Use a single line between direct and from import.
lines-between-types = 1
# Order imports by type (standard library, third-party, first-party).
order-by-type = true

[tool.ruff.lint.mccabe]
# A function over this is doing too much. Decompose it; don't raise the limit.
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50
# Public functions take keyword-only arguments (a bare `*`), so few
# positional parameters should ever be needed.
max-positional-args = 3

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

line-ending = "lf"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting docstring code snippets.
docstring-code-line-length = "dynamic"

[tool.pytest]
testpaths = ["tests"]
# importlib mode plus pythonpath = ["."] lets tests import shared helpers as
# `from tests.factories import ...` without any __init__.py files, and lets two
# test files share a name in different folders.
addopts = ["--import-mode=importlib", "-ra"]
pythonpath = ["."]
# Turns on strict_config, strict_markers, strict_xfail, and
# strict_parametrization_ids.
strict = true

[tool.coverage.run]
branch = true
# The skill package, plus the asset scripts the skill copies into projects.
source = ["python_project", "python-project/assets/scripts"]

[tool.coverage.report]
# New code ships with tests covering at least 90% of it. For an existing
# project below this, `devbox run coverage-diff` enforces it on changed lines.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.vulture]
# The skill's code sits under python-project/, not a root src/ (see AGENTS.md).
paths = ["python-project/src", "python-project/assets/scripts"]
# 60 keeps unused functions and classes in the report; at 80 and above vulture
# only reports unused imports, variables, and unreachable code.
min_confidence = 60
# Entry points named in [project.scripts] look unused to vulture. List them here.
ignore_names = ["main"]

[tool.basedpyright]
# basedpyright's VS Code extension reads this table too, so the editor and
# `uv run basedpyright` agree.
# One of: off, basic, standard. Strict mode is written as standard plus
# `strict = ["src"]`, so tests stay at standard. Ruff's annotation rules follow it.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# The skill's code sits under python-project/, not a root src/ (see AGENTS.md).
include = ["python-project/src", "python-project/assets/scripts", "tests"]
# The asset scripts are standalone modules; tests/conftest.py puts them on
# sys.path, and this tells basedpyright the same.
extraPaths = ["python-project/assets/scripts"]


[tool.poe.tasks]
# file-length and coverage-diff run the skill's scripts in place (see AGENTS.md).
lint = {help = "Lint with ruff", cmd = "ruff check"}
format = {help = "Format, then apply ruff's safe fixes", sequence = [{cmd = "ruff format"}, {cmd = "ruff check --fix"}]}
format-check = {help = "Check formatting without changing files", cmd = "ruff format --check"}
test = {help = "Run the test suite", cmd = "pytest"}
coverage = {help = "Run tests with coverage; fails under fail_under", cmd = "pytest --cov --cov-report=term-missing --cov-report=json"}
coverage-diff = {help = "Coverage of lines changed since the merge base; fails under 90%", sequence = [{cmd = "pytest --cov --cov-report=json --cov-fail-under=0 -q"}, {cmd = "python python-project/assets/scripts/changed_lines_coverage.py"}]}
deadcode = {help = "Report unused code", cmd = "vulture"}
typecheck = {help = "Type-check at the mode in [tool.basedpyright]", cmd = "basedpyright"}
file-length = {help = "Enforce the 500-line file limit", cmd = "python python-project/assets/scripts/check_file_length.py python-project/src python-project/assets/scripts tests"}
check = {help = "Every check in turn", sequence = ["lint", "format-check", "file-length", "typecheck", "coverage", "deadcode"]}

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "jsonschema>=4.26.0",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-project>=0.1.0",
    "ruff>=0.17.1",
    "vulture>=2.16",
]
