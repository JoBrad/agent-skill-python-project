[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
# New code ships with tests covering at least 90% of it. For an existing
# project below this, `uv run poe coverage-diff` enforces it on changed lines.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
